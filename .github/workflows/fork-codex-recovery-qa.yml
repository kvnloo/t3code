name: Fork QA - Codex recovery

on:
  pull_request:
    branches:
      - review/base-t3-codex-recovery-20261012

permissions:
  contents: read

jobs:
  codex-recovery:
    name: Codex recovery integration
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true
      - name: Codex recovery integration
        working-directory: apps/server
        run: vp test run src/orchestration-v2/Adapters/CodexSessionRecovery.integration.test.ts --testTimeout 30000
