name: K3s P0 offline contract
on:
  pull_request:
    paths:
      - "examples/k3s-p0/**"
      - ".github/workflows/k3s-p0-contract.yml"
  push:
    branches-ignore: [main]
    paths:
      - "examples/k3s-p0/**"
      - ".github/workflows/k3s-p0-contract.yml"
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.2"
      - name: Validate bounded P0 manifest and digest renderer
        run: python -m unittest discover -s examples/k3s-p0 -p 'test_*.py' -v
