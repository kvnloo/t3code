name: Mobile Android Standalone APK

# Fork-only, Lawnchair-style build: plain Gradle on a free GitHub runner, no EAS, no secrets.
on:
  push:
    branches: ["apk/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Prebuild
        working-directory: apps/mobile
        run: |
          vp exec expo prebuild --clean --platform android --no-install
          # Distinct id so it installs beside the EAS-signed Preview app instead of clashing on signature.
          sed -i 's/applicationId "com.t3tools.t3code.preview"/applicationId "com.t3tools.t3code.preview.fork"/' android/app/build.gradle
          grep -n applicationId android/app/build.gradle
          sed -i 's/<string name="app_name">[^<]*</<string name="app_name">T3 Fork</' android/app/src/main/res/values/strings.xml
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble release APK (debug-signed, JS bundled)
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: t3code-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
